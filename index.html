<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Driver: Perfect Scale</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #020202; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; user-select: none; -webkit-user-select: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 8; transition: opacity 0.1s ease-out; }
        #game-touch-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto !important; }

        /* UI TUNING */
        #hud { position: absolute; top: 15px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        h1 { margin: 0; font-size: 60px; color: #fff; text-shadow: 0 0 20px #fff; font-weight: 800; line-height: 1; }
        .sub-text { font-size: 20px; color: #0ff; margin-top: 5px; text-shadow: 0 0 10px #0ff; font-weight: bold; }
        .best-score-text { font-size: 14px; color: #aaa; margin-top: 5px; font-weight: bold; }
        #health-bar-container { width: 220px; height: 12px; border: 2px solid #555; margin-top: 10px; background: #222; border-radius: 6px; overflow: hidden; }
        #health-fill { width: 100%; height: 100%; background-color: #0f0; transition: width 0.1s linear, background-color 0.2s; }

        #coin-display { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.6); padding: 5px 15px 5px 5px; border-radius: 30px; border: 1px solid #444; }
        .coin-icon { width: 28px; height: 28px; background: #ffd700; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px #ffd700; }
        #total-coins-text { color: #ffd700; font-size: 22px; font-weight: bold; text-shadow: 0 0 5px #ffd700; }

        .top-btn { position: absolute; top: 20px; width: 45px; height: 45px; background: rgba(0, 255, 255, 0.1); border: 2px solid #0ff; border-radius: 50%; color: #0ff; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 10px #0ff; }
        .top-btn:active { background: #0ff; color: #000; }
        #pause-btn { right: 20px; }
        #sound-btn { right: 75px; }
        #shop-btn { position: absolute; bottom: 30px; right: 20px; width: 65px; height: 65px; background: #111; border: 3px solid #ffd700; border-radius: 18px; color: #ffd700; font-size: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px #ffd700, inset 0 0 10px #ffd700; }
        #shop-btn:active { transform: scale(0.95); background: #333; }

        .overlay-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: rgba(5, 10, 15, 0.98); border: 3px solid #0ff; border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 0 80px rgba(0, 255, 255, 0.4); max-height: 85vh; overflow-y: auto; z-index: 20; }
        .overlay-menu h2 { color: #fff; font-size: 36px; margin: 0 0 20px 0; text-shadow: 0 0 20px #0ff; }
        .stat-row { display: flex; justify-content: space-between; margin: 20px 0; color: #fff; font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .stat-val { font-weight: bold; color: #0f0; font-size: 24px; }
        button.action-btn { background: #0ff; color: #000; border: none; width: 100%; padding: 15px 0; font-size: 24px; font-weight: 900; border-radius: 50px; margin-top: 25px; cursor: pointer; box-shadow: 0 0 30px #0ff; font-family: inherit; text-transform: uppercase; }
        .shop-section-title { text-align: left; color: #888; font-size: 16px; margin: 25px 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; font-weight: bold; letter-spacing: 2px; }
        .shop-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); margin: 8px 0; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .color-preview { width: 45px; height: 45px; border-radius: 10px; border: 2px solid #fff; }
        .vehicle-preview { width: 55px; height: 55px; border-radius: 10px; border: 2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:28px; background: #222; }
        .upgrade-preview { width: 55px; height: 55px; border-radius: 10px; border: 2px solid #0f0; display:flex; align-items:center; justify-content:center; font-size:28px; background: #002200; color: #0f0; }
        .item-info { flex-grow: 1; text-align: left; margin-left: 15px; color: #fff; }
        .item-name { font-size: 18px; font-weight: bold; }
        .item-desc { font-size: 12px; color: #aaa; margin-top: 2px; font-style: italic; }
        .item-cost { color: #ffd700; font-size: 15px; margin-top: 2px; }
        .level-pips { display:flex; gap:3px; margin-top:5px; }
        .pip { width: 15px; height: 6px; background: #333; border:1px solid #555; }
        .pip.active { background: #0f0; border-color:#fff; box-shadow: 0 0 5px #0f0; }
        
        .buy-btn { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; font-family: inherit; }

        #alert-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 350px; background: #100; border: 3px solid #f00; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 0 50px #f00; z-index: 100; }
        #alert-title { color: #f00; font-size: 26px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 10px #f00; animation: blink 0.5s infinite; }
        #alert-msg { color: #fff; font-size: 16px; margin-bottom: 20px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .float-text { position: absolute; color: #ff0; font-weight: bold; font-size: 35px; pointer-events: none; text-shadow: 0 0 15px #ff0; animation: floatUp 0.8s forwards; z-index: 15; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-70px) scale(1.5); } }
        .control-hint { position: absolute; bottom: 40px; width: 35%; padding: 15px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); text-align: center; border-radius: 20px; pointer-events: none; font-size: 16px; font-weight: bold; z-index: 9; }
        #left-hint { left: 5%; } #right-hint { right: 5%; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="damage-overlay"></div>
    <div id="game-touch-zone"></div>

    <div id="ui-layer">
        <div id="alert-modal" class="interactive">
            <div id="alert-title">SYSTEM ERROR</div>
            <div id="alert-msg">INSUFFICIENT FUNDS</div>
            <button class="action-btn" style="background:#f00; box-shadow:0 0 20px #f00; padding:10px; font-size:16px" onclick="closeAlert()">ACKNOWLEDGE</button>
        </div>

        <div id="coin-display" class="interactive"><div class="coin-icon"></div><span id="total-coins-text">0</span></div>
        <div id="sound-btn" class="top-btn interactive">🔊</div>
        <div id="pause-btn" class="top-btn interactive">||</div>
        <div id="shop-btn" class="interactive">$</div>

        <div id="hud">
            <h1 id="score-display">0</h1>
            <div id="health-bar-container"><div id="health-fill"></div></div>
            <div class="sub-text" id="level-display">LEVEL 1</div>
            <div class="best-score-text">BEST: <span id="hud-high-score">0</span></div>
        </div>

        <div id="pause-menu" class="overlay-menu interactive">
            <h2>PAUSED</h2>
            <button class="action-btn" id="resume-btn">RESUME</button>
            <button class="action-btn" id="quit-btn" style="background:#f00; box-shadow:0 0 30px #f00; margin-top:15px">QUIT</button>
        </div>

        <div id="scorecard" class="overlay-menu interactive">
            <h2 style="color:#f00; font-size:45px; animation: pulse 0.5s infinite">TERMINATED</h2>
            <div class="stat-row"><span>Score</span><span class="stat-val" id="final-score">0</span></div>
            <div class="stat-row"><span>Coins Found</span><span class="stat-val" id="final-bonuses">0</span></div>
            <div class="stat-row"><span>High Score</span><span class="stat-val" id="best-score">0</span></div>
            <button class="action-btn" id="restart-btn">REBOOT</button>
        </div>

        <div id="shop-menu" class="overlay-menu interactive">
            <h2 style="color:#ffd700">GARAGE</h2>
            <div style="color:#aaa; margin-bottom:15px; font-size:14px">Earn coins to unlock power</div>
            <div id="shop-items-container"></div>
            <button class="action-btn" id="close-shop-btn">CLOSE</button>
        </div>

        <div id="left-hint" class="control-hint">HOLD LEFT</div>
        <div id="right-hint" class="control-hint">HOLD RIGHT</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const touchZone = document.getElementById('game-touch-zone');
    const damageOverlay = document.getElementById('damage-overlay');
    const alertModal = document.getElementById('alert-modal');

    // UI Refs
    const elScore = document.getElementById('score-display');
    const elLevel = document.getElementById('level-display');
    const elHealth = document.getElementById('health-fill');
    const elHudHighScore = document.getElementById('hud-high-score');
    const elTotalCoins = document.getElementById('total-coins-text');
    const elShopBtn = document.getElementById('shop-btn');
    const elHud = document.getElementById('hud');
    const elHints = document.querySelectorAll('.control-hint');
    const elSoundBtn = document.getElementById('sound-btn');
    const elScorecard = document.getElementById('scorecard');
    const elPauseMenu = document.getElementById('pause-menu');
    const elShopMenu = document.getElementById('shop-menu');
    const elShopContainer = document.getElementById('shop-items-container');
    
    // Config - PERFECT SCALE
    const BASE_VERTICAL_SPEED = 7; 
    const BASE_LATERAL_SPEED = 9;
    const LEVEL_SCORE_THRESHOLD = 1000; 
    let MAGNET_RANGE = 180; // Reasonable magnetic pull
    const MAGNET_STRENGTH = 15;      

    // --- DATA ---
    const SKINS = [
        { id: 'cyan', name: 'Neon Cyan', color: '#0ff', price: 0 },
        { id: 'magenta', name: 'Hot Pink', color: '#f0f', price: 50 },
        { id: 'lime', name: 'Toxic Lime', color: '#0f0', price: 150 },
        { id: 'gold', name: 'Midas Gold', color: '#ffd700', price: 300 },
        { id: 'white', name: 'Ghost', color: '#fff', price: 600 },
        { id: 'red', name: 'Crimson', color: '#f00', price: 1000 }
    ];

    const MODELS = [
        { id: 'wedge', name: 'Interceptor', type: 'Wedge', price: 0, icon: '🚀', stats: { hp: 120, speed: 10, magnet: 180, desc: "Balanced Starter" } },
        { id: 'tank', name: 'Titan', type: 'Rect', price: 250, icon: '🚛', stats: { hp: 200, speed: 10, magnet: 200, desc: "Max Armor" } },
        { id: 'saucer', name: 'Spectre', type: 'Circle', price: 750, icon: '🛸', stats: { hp: 150, speed: 12, magnet: 400, desc: "Max Magnet" } },
        { id: 'stinger', name: 'Stinger', type: 'Jet', price: 2000, icon: '✈️', stats: { hp: 150, speed: 16, magnet: 200, desc: "Hyper Speed" } },
        { id: 'omega', name: 'The Hare', type: 'Omega', price: 5000, icon: '🐰', stats: { hp: 300, speed: 18, magnet: 600, desc: "ULTIMATE POWER" } }
    ];

    const UPGRADES = [
        { id: 'armor', name: 'Nano Armor', icon: '❤️', desc: '+Max Health', costs: [200, 500, 1000] },
        { id: 'handling', name: 'Thrusters', icon: '⚡', desc: '+Lateral Speed', costs: [200, 500, 1000] },
        { id: 'magnet', name: 'Attractor', icon: '🧲', desc: '+Magnet Range', costs: [200, 500, 1000] },
        { id: 'shield', name: 'Deflector', icon: '🛡️', desc: 'Auto-Shield', costs: [500, 1000, 2000] },
        { id: 'guns', name: 'Plasma Gun', icon: '🔫', desc: 'Auto-Fire System', costs: [300, 600, 1200] }
    ];

    // State
    let gameState = 'START'; 
    let score = 0;
    let bonusCount = 0; 
    let highScore = localStorage.getItem('neonHighScore') || 0;
    let totalCoins = parseInt(localStorage.getItem('neonTotalCoins')) || 0;
    
    // Garage State
    let unlockedSkins = JSON.parse(localStorage.getItem('neonUnlockedSkins')) || ['cyan'];
    let unlockedModels = JSON.parse(localStorage.getItem('neonUnlockedModels')) || ['wedge'];
    let currentSkin = localStorage.getItem('neonCurrentSkin') || 'cyan';
    let currentModelId = localStorage.getItem('neonCurrentModel') || 'wedge';
    
    let upgradeLevels = JSON.parse(localStorage.getItem('neonUpgradeLevels')) || { armor: 0, handling: 0, magnet: 0, shield: 0, guns: 0 };

    let isSoundOn = localStorage.getItem('neonSound') !== 'false';
    updateSoundIcon();

    let level = 1;
    let verticalSpeed = BASE_VERTICAL_SPEED;
    let lastTime = 0;
    let animationId = null;
    let screenShake = 0;
    let shockwaves = [];

    elHudHighScore.innerText = Math.floor(highScore);
    elTotalCoins.innerText = totalCoins;
    elHud.style.display = 'none'; 

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function triggerFlash(color) {
        damageOverlay.style.transition = 'none';
        damageOverlay.style.backgroundColor = color;
        damageOverlay.style.opacity = 0.9;
        setTimeout(() => { damageOverlay.style.transition = 'opacity 0.8s ease-out'; damageOverlay.style.opacity = 0; }, 50);
    }

    function showCustomAlert() { alertModal.style.display = 'block'; Sound.playSFX('crash'); }
    window.closeAlert = function() { alertModal.style.display = 'none'; Sound.playSFX('click'); }

    // --- AUDIO ENGINE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();
    let engineSource = null, engineFilter = null, engineGain = null, noiseBuffer = null;

    const Sound = {
        initBuffer: function() {
            if (noiseBuffer) return;
            const bufferSize = audioCtx.sampleRate * 2;
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        },
        startEngine: function() {
            if (!isSoundOn || engineSource) return;
            this.initBuffer();
            engineSource = audioCtx.createBufferSource(); engineSource.buffer = noiseBuffer; engineSource.loop = true;
            engineFilter = audioCtx.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 200; 
            engineGain = audioCtx.createGain(); engineGain.gain.value = 0.15; 
            engineSource.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineSource.start();
        },
        revEngine: function(isRevving) {
            if (!engineSource || !isSoundOn) return;
            const now = audioCtx.currentTime;
            if (isRevving) {
                engineFilter.frequency.cancelScheduledValues(now); engineFilter.frequency.linearRampToValueAtTime(800, now + 0.4); 
                engineGain.gain.cancelScheduledValues(now); engineGain.gain.linearRampToValueAtTime(0.3, now + 0.2);
            } else {
                engineFilter.frequency.cancelScheduledValues(now); engineFilter.frequency.linearRampToValueAtTime(200, now + 0.5);
                engineGain.gain.cancelScheduledValues(now); engineGain.gain.linearRampToValueAtTime(0.15, now + 0.5);
            }
        },
        stopEngine: function() { if (engineSource) { try { engineSource.stop(); } catch(e){} engineSource = null; } },
        playSFX: function(type) {
            if(!isSoundOn) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'coin') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1108, now + 0.05); osc.frequency.setValueAtTime(1318, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'crash') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.4);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'powerup') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'break') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'laser') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            }
        }
    };

    function toggleSound(e) { if(e) e.stopPropagation(); isSoundOn = !isSoundOn; localStorage.setItem('neonSound', isSoundOn); updateSoundIcon(); if(isSoundOn) { Sound.playSFX('click'); if(gameState === 'PLAYING') Sound.startEngine(); } else { Sound.stopEngine(); } }
    function updateSoundIcon() { elSoundBtn.innerText = isSoundOn ? "🔊" : "🔇"; elSoundBtn.style.opacity = isSoundOn ? "1" : "0.5"; }
    elSoundBtn.addEventListener('click', toggleSound);

    // --- VISUAL CLASSES (PERFECT SCALE) ---
    class Shockwave {
        constructor(x, y) { this.x = x; this.y = y; this.r = 1; this.alpha = 1; this.width = 12; }
        update(dt) { this.r += 18 * dt; this.width *= 0.9; this.alpha -= 0.02 * dt; }
        draw() { if(this.alpha <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.lineWidth = this.width; ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`; ctx.stroke(); ctx.restore(); }
    }

    class Bullet {
        constructor(x, y) { this.x = x; this.y = y; this.w = 5; this.h = 16; } // Visible
        update(dtScale) { this.y -= 25 * dtScale; }
        draw() { ctx.fillStyle = '#ff4500'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff4500'; ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h); ctx.shadowBlur = 0; }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 12 + 4; 
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.alpha = 1; this.decay = Math.random() * 0.02 + 0.005; this.color = color; this.size = Math.random() * 5 + 3; this.gravity = 0.2; 
        }
        update(dtScale) { this.x += this.vx * dtScale; this.y += this.vy * dtScale; this.vy += this.gravity * dtScale; this.alpha -= this.decay * dtScale; }
        draw() { ctx.globalAlpha = Math.max(0, this.alpha); if(this.alpha > 0.8) ctx.fillStyle = '#fff'; else if (this.alpha > 0.6) ctx.fillStyle = '#ff0'; else if (this.alpha > 0.3) ctx.fillStyle = '#f00'; else ctx.fillStyle = '#555'; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
    }

    class Trail {
        constructor() { this.history = []; this.maxSize = 22; }
        update(x, y) { this.history.push({x: x, y: y}); if(this.history.length > this.maxSize) this.history.shift(); }
        draw(baseWidth, color) {
            if(this.history.length < 1) return;
            const maxRadius = baseWidth * 0.5; const minRadius = maxRadius * 0.1;
            ctx.shadowBlur = 20; ctx.shadowColor = color; ctx.fillStyle = color;
            for(let i = this.history.length - 1; i >= 0; i--) { const point = this.history[i]; let taperPct = i / Math.max(1, this.history.length - 1); let currentRadius = minRadius + (maxRadius - minRadius) * taperPct; ctx.globalAlpha = 0.3 + (taperPct * 0.5); ctx.beginPath(); ctx.arc(point.x + baseWidth/2, point.y + 50, currentRadius, 0, Math.PI * 2); ctx.fill(); }
            ctx.shadowBlur = 8; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
            for(let i = this.history.length - 1; i >= 0; i--) { const point = this.history[i]; let taperPct = i / Math.max(1, this.history.length - 1); let currentRadius = (minRadius + (maxRadius - minRadius) * taperPct) * 0.4; ctx.globalAlpha = 0.6 + (taperPct * 0.4); ctx.beginPath(); ctx.arc(point.x + baseWidth/2, point.y + 50, currentRadius, 0, Math.PI * 2); ctx.fill(); }
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        }
        reset() { this.history = []; }
    }

    const player = {
        x: 0, y: 0, w: 40, h: 65, color: '#0ff', // PERFECT SCALE
        dx: 0, lateralSpeed: 9,
        maxHealth: 100, currentHealth: 100,
        isInvincible: false, invincibleTimer: 0,
        trail: new Trail(), hasShield: false, magnetTimer: 0,
        blasterTimer: 0, lastShotTime: 0, shieldRespawnTimer: 0,

        reset: function() {
            this.x = canvas.width / 2 - 20; this.y = canvas.height - 150;
            
            let model = MODELS.find(m => m.id === currentModelId);
            let skin = SKINS.find(s => s.id === currentSkin);
            const isOmega = (currentModelId === 'omega');
            
            let armorMod = 1 + (upgradeLevels.armor * 0.2); 
            if(upgradeLevels.armor === 2) armorMod = 1.5;
            if(upgradeLevels.armor === 3 || isOmega) armorMod = 2.0; 
            this.maxHealth = model.stats.hp * armorMod;
            this.currentHealth = this.maxHealth;

            let speedMod = 1 + (upgradeLevels.handling * 0.1); 
            if(isOmega) speedMod = 1.3; 
            this.lateralSpeed = model.stats.speed * speedMod;

            let magMod = 1 + (upgradeLevels.magnet * 0.25);
            if(upgradeLevels.magnet === 3 || isOmega) magMod = 2.0; 
            MAGNET_RANGE = model.stats.magnet * magMod; 
            
            this.color = skin ? skin.color : '#0ff';
            
            this.isInvincible = false;

    let bullets = [];

    function createFloatingText(text, x, y, color='#ff0') {

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime; lastTime = timestamp;
        if (gameState === 'PAUSED') return;
        const dtScale = dt / (1000 / 60);

        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        if (screenShake > 0) { let dx = (Math.random() - 0.5) * screenShake; let dy = (Math.random() - 0.5) * screenShake; ctx.translate(dx, dy); if (screenShake > 30) { let rot = (Math.random() - 0.5) * 0.1; ctx.rotate(rot); } screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }

            let newLevel = Math.floor(score / LEVEL_SCORE_THRESHOLD) + 1;
            if (newLevel > level) { level = newLevel; verticalSpeed += 1.0; elLevel.innerText = "LEVEL " + level; }
            player.update(dtScale); player.draw(); updateHealthUI();
            
            if (Math.random() < (0.02 + level * 0.005) * dtScale) if (obstacles.length === 0 || obstacles[obstacles.length-1].y > 150) obstacles.push(new Obstacle());
            if (Math.random() < 0.02 * dtScale) bonuses.push(new Bonus());
            if (Math.random() < 0.002 * dtScale) powerups.push(new PowerUp());

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.update(dtScale); b.draw(); if (b.y < 0) bullets.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.update(dtScale); obs.draw();
                let playerRadius = player.w / 2; let obsRadius = obs.w / 2;
                let dx = (player.x + player.w/2) - (obs.x + obs.w/2); let dy = (player.y + player.h/2) - (obs.y + obs.h/2);
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j]; let bDx = b.x - (obs.x + obs.w/2); let bDy = b.y - (obs.y + obs.h/2);
                    if (Math.sqrt(bDx*bDx + bDy*bDy) < obsRadius + 6) {
                        createFloatingText("+100", obs.x, obs.y, '#ff4500'); Sound.playSFX('break'); 
                        for(let k=0; k<10; k++) particles.push(new Particle(obs.x+obs.w/2, obs.y+obs.h/2, obs.color));

            }
            
            for (let i = bonuses.length - 1; i >= 0; i--) {

                let dx = (player.x + player.w/2) - b.x; let dy = (player.y + player.h/2) - b.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < (player.w/2 + b.r)) {
                    score += 500; bonusCount++; totalCoins++; localStorage.setItem('neonTotalCoins', totalCoins); elTotalCoins.innerText = totalCoins; Sound.playSFX('coin'); createFloatingText("+500", b.x, b.y); bonuses.splice(i, 1);
                } else if (b.y > canvas.height) bonuses.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i]; p.update(dtScale); p.draw();
                let dx = (player.x + player.w/2) - p.x; let dy = (player.y + player.h/2) - p.y;
                if (Math.sqrt(dx*dx + dy*dy) < (player.w/2 + p.r)) { 
                    Sound.playSFX('powerup');
                    if (p.type === 0) { player.hasShield = true; createFloatingText("SHIELD!", p.x, p.y, '#0ff'); } 
                    else if (p.type === 1) { player.magnetTimer = 600; createFloatingText("MAGNET!", p.x, p.y, '#a020f0'); }
                    else { player.blasterTimer = 600; createFloatingText("OVERCLOCK!", p.x, p.y, '#ff4500'); }
                    powerups.splice(i, 1);
                } else if (p.y > canvas.height) powerups.splice(i, 1);
            }

        } else if (gameState === 'EXPLODING') {
            obstacles.forEach(obs => obs.draw()); bonuses.forEach(b => b.draw());
            for(let i = shockwaves.length - 1; i >= 0; i--) { let s = shockwaves[i]; s.update(dtScale); s.draw(); if(s.alpha <= 0) shockwaves.splice(i, 1); }
            for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.update(dtScale); p.draw(); if (p.alpha <= 0) particles.splice(i, 1); }

        ctx.restore(); animationId = requestAnimationFrame(loop);
    }

    let modelTitle = document.createElement('div'); modelTitle.className = 'shop-section-title'; modelTitle.innerText = "CHASSIS"; elShopContainer.appendChild(modelTitle);
    MODELS.forEach(model => { const isUnlocked = unlockedModels.includes(model.id); const isEquipped = currentModelId === model.id; const div = document.createElement('div'); div.className = 'shop-item'; let btnHTML = ''; if (isEquipped) btnHTML = `<button class="buy-btn" style="background:#555; color:#fff" disabled>EQUIPPED</button>`; else if (isUnlocked) btnHTML = `<button class="buy-btn" style="background:#0f0" onclick="window.equipModel('${model.id}')">EQUIP</button>`; else btnHTML = `<button class="buy-btn" style="background:#ffd700" onclick="window.buyModel('${model.id}', ${model.price})">BUY</button>`; div.innerHTML = `<div style="display:flex; align-items:center"><div class="vehicle-preview" style="background:#222; color:${player.color}; box-shadow: 0 0 5px ${player.color}">${model.icon}</div><div class="item-info"><div class="item-name">${model.name}</div><div class="item-desc">${model.stats.desc}</div><div class="item-cost">${model.price > 0 ? model.price + ' Coins' : 'Free'}</div></div></div>${btnHTML}`; elShopContainer.appendChild(div); });
    let techTitle = document.createElement('div'); techTitle.className = 'shop-section-title'; techTitle.innerText = "TECH UPGRADES"; elShopContainer.appendChild(techTitle);
    UPGRADES.forEach(tech => { const currentLvl = upgradeLevels[tech.id]; const isMax = currentLvl >= 3; const cost = tech.costs[currentLvl]; const div = document.createElement('div'); div.className = 'shop-item'; let btnHTML = ''; if (isMax) btnHTML = `<button class="buy-btn" style="background:#555; color:#fff" disabled>MAX</button>`; else btnHTML = `<button class="buy-btn" style="background:#ffd700" onclick="window.buyUpgrade('${tech.id}', ${cost})">UPGRADE</button>`; let pips = ''; for(let i=0; i<3; i++) pips += `<div class="pip ${i < currentLvl ? 'active' : ''}"></div>`; div.innerHTML = `<div style="display:flex; align-items:center"><div class="upgrade-preview">${tech.icon}</div><div class="item-info"><div class="item-name">${tech.name}</div><div class="item-desc">${tech.desc}</div><div class="level-pips">${pips}</div><div class="item-cost">${isMax ? 'Maxed' : cost + ' Coins'}</div></div></div>${btnHTML}`; elShopContainer.appendChild(div); });
    let paintTitle = document.createElement('div'); paintTitle.className = 'shop-section-title'; paintTitle.innerText = "PAINT"; elShopContainer.appendChild(paintTitle);
    SKINS.forEach(skin => { const isUnlocked = unlockedSkins.includes(skin.id); const isEquipped = currentSkin === skin.id; const div = document.createElement('div'); div.className = 'shop-item'; let btnHTML = ''; if (isEquipped) btnHTML = `<button class="buy-btn" style="background:#555; color:#fff" disabled>EQUIPPED</button>`; else if (isUnlocked) btnHTML = `<button class="buy-btn" style="background:#0f0" onclick="window.equipSkin('${skin.id}')">EQUIP</button>`; else btnHTML = `<button class="buy-btn" style="background:#ffd700" onclick="window.buySkin('${skin.id}', ${skin.price})">BUY</button>`; div.innerHTML = `<div style="display:flex; align-items:center"><div class="color-preview" style="background:${skin.color}; box-shadow: 0 0 5px ${skin.color}"></div><div class="item-info"><div class="item-name">${skin.name}</div><div class="item-cost">${skin.price > 0 ? skin.price + ' Coins' : 'Free'}</div></div></div>${btnHTML}`; elShopContainer.appendChild(div); }); }
    window.buySkin = function(id, price) { if(totalCoins >= price) { totalCoins -= price; localStorage.setItem('neonTotalCoins', totalCoins); elTotalCoins.innerText = totalCoins; unlockedSkins.push(id); localStorage.setItem('neonUnlockedSkins', JSON.stringify(unlockedSkins)); Sound.playSFX('coin'); openShop(); } else { showCustomAlert(); } };
    window.buyModel = function(id, price) { if(totalCoins >= price) { totalCoins -= price; localStorage.setItem('neonTotalCoins', totalCoins); elTotalCoins.innerText = totalCoins; unlockedModels.push(id); localStorage.setItem('neonUnlockedModels', JSON.stringify(unlockedModels)); Sound.playSFX('coin'); openShop(); } else { showCustomAlert(); } };
    window.buyUpgrade = function(id, price) { if(totalCoins >= price) { totalCoins -= price; localStorage.setItem('neonTotalCoins', totalCoins); elTotalCoins.innerText = totalCoins; upgradeLevels[id]++; localStorage.setItem('neonUpgradeLevels', JSON.stringify(upgradeLevels)); Sound.playSFX('coin'); openShop(); } else { showCustomAlert(); } };
    window.equipSkin = function(id) { currentSkin = id; localStorage.setItem('neonCurrentSkin', currentSkin); player.reset(); Sound.playSFX('click'); openShop(); };
    window.equipModel = function(id) { currentModelId = id; localStorage.setItem('neonCurrentModel', currentModelId); player.reset(); Sound.playSFX('click'); openShop(); };
    function startNewGame() { if (audioCtx.state === 'suspended') audioCtx.resume(); if (animationId) cancelAnimationFrame(animationId); gameState = 'PLAYING'; score = 0; bonusCount = 0; level = 1; verticalSpeed = BASE_VERTICAL_SPEED; obstacles = []; bonuses = []; powerups = []; bullets = []; player.reset(); Sound.playSFX('click'); Sound.startEngine(); elScorecard.style.display = 'none'; elPauseMenu.style.display = 'none'; elShopMenu.style.display = 'none'; elShopBtn.style.display = 'none'; elHud.style.display = 'flex'; elHints.forEach(h => h.style.display = 'none'); lastTime = performance.now(); animationId = requestAnimationFrame(loop); }
    returnToMainMenu();
</script>
